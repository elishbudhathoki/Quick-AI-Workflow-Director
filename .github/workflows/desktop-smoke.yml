name: Desktop source smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Set up clean clone
        run: python setup.py
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Source syntax
        run: |
          python -m py_compile setup.py start.py prototype/server.py prototype/map_processor.py prototype/comfy_maps.py
          node --check prototype/app.js
      - name: Server and Canny smoke
        run: .venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }} tests/smoke_install.py

  maps:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-maps.txt
      - name: Install learned-map dependencies
        run: python setup.py --maps
      - name: Import learned-map processors
        run: python tests/check_map_install.py
